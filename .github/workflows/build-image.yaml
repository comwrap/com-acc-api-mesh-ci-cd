name: Build Runner Image

# Publishes ghcr.io/<owner>/aio-mesh-runner, the container the Deploy Mesh job
# runs in. Before this workflow the image was whatever the last person to run
# `docker buildx --push` by hand had on their laptop.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/images/aio-mesh-runner/**"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

jobs:
  build:
    name: Build and push aio-mesh-runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/workflows/images/aio-mesh-runner
          # Deploy runs on linux/amd64 runners; building other arches only costs
          # time here.
          platforms: linux/amd64
          push: true
          # Deploy workflows consume :latest. The sha tag is the rollback handle —
          # pin a deploy to it without having to rebuild anything.
          tags: |
            ghcr.io/${{ github.repository_owner }}/aio-mesh-runner:latest
            ghcr.io/${{ github.repository_owner }}/aio-mesh-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
